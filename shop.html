<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فروشگاه | عطر مجد</title>
  <meta name="description" content="خرید آنلاین عطرهای لوکس عطر مجد با فیلتر برند، قیمت و نوع رایحه.">
  <meta name="theme-color" content="#110b08">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23110b08'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23e7b98c' font-family='serif'%3E%D9%85%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
<main>
  
  <section class="page-hero ">
    <div class="hero-bg" style="background-image:url('assets/img/hero-shop.jpg')"></div>
    <div class="container">
      <h1>کالکشن اختصاصی عطرهای ما</h1>
      <p>دنیایی از رایحه‌های لوکس که برای مسحور کردن حواس شما ساخته شده‌اند.</p>
      
    </div>
  </section>

  <div class="container section shop-layout">
    <aside class="filters panel" aria-label="فیلترها">
      <h2 class="panel-title" style="display:flex;justify-content:space-between;align-items:center">فیلتر بر اساس:
        <button class="icon-btn filter-toggle" id="filter-close" aria-label="بستن فیلترها"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </h2>
      <div class="filter-group">
        <h4>برند</h4>
        <div id="brand-filters"></div>
      </div>
      <div class="filter-group">
        <h4>محدوده قیمت</h4>
        <div class="range-wrap">
          <label class="range-label" for="price-min">حداقل</label>
          <input type="range" id="price-min">
          <label class="range-label" for="price-max">حداکثر</label>
          <input type="range" id="price-max">
          <div class="range-values"><span id="price-label-min"></span><span>تا</span><span id="price-label-max"></span></div>
        </div>
      </div>
      <div class="filter-group">
        <h4>نوع رایحه</h4>
        <div id="scent-filters"></div>
      </div>
      <button class="clear-filters" id="clear-filters">پاک کردن همه</button>
    </aside>

    <section>
      <div class="shop-toolbar">
        <div>
          <span class="result-count" id="result-count"></span>
          <div class="active-query" id="active-query"></div>
        </div>
        <div class="toolbar-controls">
          <button class="btn btn-ghost btn-sm filter-toggle" id="filter-toggle"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></svg> فیلترها</button>
          <label for="sort">مرتب‌سازی:</label>
          <select id="sort" class="select">
            <option value="default">پیش‌فرض</option>
            <option value="rating">محبوب‌ترین</option>
            <option value="price-asc">ارزان‌ترین</option>
            <option value="price-desc">گران‌ترین</option>
            <option value="name">نام (الفبا)</option>
          </select>
          <button class="icon-btn view-btn" data-view="list" aria-label="نمایش فهرستی"><svg class="icon" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg></button>
          <button class="icon-btn view-btn" data-view="grid" aria-label="نمایش شبکه‌ای"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button>
        </div>
      </div>
      <div class="product-grid" id="product-grid"></div>
      <nav class="pagination" id="pagination" aria-label="صفحه‌بندی"></nav>
    </section>
  </div>
</main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
