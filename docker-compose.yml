services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: majd
      POSTGRES_USER: majd
      POSTGRES_PASSWORD: majd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majd"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # اجرای محلی/نمایشی با image production. برای استقرار واقعی: docker-compose.prod.yml و DEPLOY.md
  init-media:
    image: majd:latest
    user: root
    entrypoint: ["chown", "10001:10001", "/app/media"]
    volumes: [media:/app/media]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    network_mode: none

  migrate:
    build: .
    image: majd:latest
    command: migrate
    env_file: .env
    environment: &app-env
      DATABASE_URL: postgres://majd:majd@db:5432/majd
      REDIS_URL: redis://redis:6379/0
      # nginx محلی روی http است؛ پشت TLS واقعی این سه را حذف یا True کنید
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
      DEPLOY_CHECK: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-media:
        condition: service_completed_successfully

  web:
    image: majd:latest
    command: web
    env_file: .env
    environment: *app-env
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: majd:latest
    command: worker
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 30s
    env_file: .env
    environment: *app-env
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    image: majd:latest
    command: beat
    healthcheck: {disable: true}  # beat پورت HTTP ندارد
    env_file: .env
    environment: *app-env
    depends_on:
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  media:
