<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>محصول | عطر مجد</title>
  <meta name="description" content="جزئیات عطر، نت‌های رایحه و خرید آنلاین از عطر مجد.">
  <meta name="theme-color" content="#110b08">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23110b08'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23e7b98c' font-family='serif'%3E%D9%85%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="product">
<main>
  <nav class="container breadcrumb" aria-label="مسیر">
    <a href="index.html">خانه</a><span>‹</span><a href="shop.html">عطرها</a><span>‹</span><strong id="crumb-name"></strong>
  </nav>

  <div class="container">
    <section class="product-top">
      <div class="gallery">
        <div class="gallery-main">
          <img id="gallery-img" src="assets/img/product-main.jpg" alt="">
          <button class="carousel-btn prev" id="gallery-prev" aria-label="تصویر قبلی"><svg class="icon" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
          <button class="carousel-btn next" id="gallery-next" aria-label="تصویر بعدی"><svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
        </div>
        <div class="gallery-thumbs" id="gallery-thumbs"></div>
      </div>

      <div class="product-info">
        <h1 id="p-name"></h1>
        <div class="product-meta"><span class="brand" id="p-brand"></span><span id="p-stars"></span></div>
        <div class="product-price" id="p-price"></div>
        <p id="p-short"></p>

        <div class="notes">
          <div class="note"><img src="assets/img/note-top.jpg" alt=""><h4>نت آغازین</h4><p id="note-top"></p></div>
          <div class="note"><img src="assets/img/note-mid.jpg" alt=""><h4>نت میانی</h4><p id="note-mid"></p></div>
          <div class="note"><img src="assets/img/note-base.jpg" alt=""><h4>نت پایه</h4><p id="note-base"></p></div>
        </div>

        <div class="buy-box">
          <div class="option-row"><span>حجم</span>
            <div class="chips"><button class="chip active" data-size="50">۵۰ میل</button><button class="chip" data-size="100">۱۰۰ میل</button></div>
          </div>
          <div class="option-row"><label for="qty">تعداد</label>
            <div class="qty"><button type="button" id="qty-minus" aria-label="کاهش">−</button><input id="qty" type="number" value="1" min="1" max="20"><button type="button" id="qty-plus" aria-label="افزایش">+</button></div>
          </div>
          <button class="btn btn-lg btn-block" id="add-to-cart">افزودن به سبد خرید</button>
          <div class="share">اشتراک‌گذاری:
            <a id="share-telegram" target="_blank" rel="noopener" aria-label="تلگرام"><svg class="icon" viewBox="0 0 24 24"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"/><path d="m9 13 9-7"/></svg></a>
            <a id="share-whatsapp" target="_blank" rel="noopener" aria-label="واتس‌اپ"><svg class="icon" viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/></svg></a>
            <a id="share-x" target="_blank" rel="noopener" aria-label="ایکس"><svg class="icon" viewBox="0 0 24 24"><path d="M4 4l16 16M20 4 4 20"/></svg></a>
            <a id="share-mail" aria-label="ایمیل"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 7 9 6 9-6"/></svg></a>
          </div>
        </div>
      </div>
    </section>

    <section class="tabs">
      <div class="tab-list" role="tablist">
        <button role="tab" aria-selected="true" aria-controls="tab-desc">توضیحات</button>
        <button role="tab" aria-selected="false" aria-controls="tab-reviews">نظرات مشتریان (<span id="reviews-count"></span>)</button>
      </div>
      <div class="tab-panel" id="tab-desc" role="tabpanel"><p id="p-desc"></p>
        <p>تمام عطرهای عطر مجد با ضمانت اصالت کالا و در بسته‌بندی نفیس ارائه می‌شوند. برای ماندگاری بیشتر، عطر را روی نقاط نبض بدن مانند مچ دست و گردن اسپری کنید.</p>
      </div>
      <div class="tab-panel" id="tab-reviews" role="tabpanel" hidden>
        <div id="reviews-list"></div>
        <form class="review-form panel panel-body" id="review-form" novalidate>
          <h3 style="font-size:1.15rem;margin:0">نظر خود را بنویسید</h3>
          <div class="form-grid">
            <div class="field"><label for="r-name">نام <span class="req">*</span></label><input id="r-name" name="name" required></div>
            <div class="field"><label for="r-rating">امتیاز</label>
              <select id="r-rating" name="rating"><option value="5">★★★★★ عالی</option><option value="4">★★★★ خوب</option><option value="3">★★★ متوسط</option><option value="2">★★ ضعیف</option><option value="1">★ بد</option></select></div>
            <div class="field full"><label for="r-text">متن نظر <span class="req">*</span></label><textarea id="r-text" name="text" required minlength="5"></textarea></div>
          </div>
          <div><button class="btn" type="submit">ثبت نظر</button></div>
          <div class="form-msg"></div>
        </form>
      </div>
    </section>

    <section class="section" style="border-top:1px solid var(--line)">
      <div class="section-head"><h2>شاید این‌ها را هم بپسندید</h2></div>
      <div class="carousel" id="related">
        <button class="carousel-btn prev" aria-label="قبلی"><svg class="icon" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        <div class="carousel-track"></div>
        <button class="carousel-btn next" aria-label="بعدی"><svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      </div>
    </section>
  </div>
</main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
