<title>{{ seo.title }}</title>
  <meta name="description" content="{{ seo.description }}">
  <meta name="robots" content="{{ seo.robots }}">
  <link rel="canonical" href="{{ seo.canonical }}">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:site_name" content="{{ seo.site_name }}">
  <meta property="og:type" content="{{ seo.og_type }}">
  <meta property="og:title" content="{{ seo.title }}">
  <meta property="og:description" content="{{ seo.description }}">
  <meta property="og:url" content="{{ seo.canonical }}">
  {% if seo.image %}<meta property="og:image" content="{{ seo.image }}">
  <meta property="og:image:alt" content="{{ seo.image_alt }}">
  {% endif %}<meta name="twitter:card" content="{% if seo.image %}summary_large_image{% else %}summary{% endif %}">
  {% if seo.twitter %}<meta name="twitter:site" content="{{ seo.twitter }}">
  {% endif %}{% for name, value in seo.verification.items %}{% if value %}<meta name="{{ name }}" content="{{ value }}">
  {% endif %}{% endfor %}{% for block in seo.jsonld %}<script type="application/ld+json">{{ block|safe }}</script>
  {% endfor %}
