<div class="field {% if field.errors %}has-error{% endif %} {{ class }}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% for e in field.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
</div>
