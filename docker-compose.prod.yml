# استقرار production عطر مجد
#   cp .env.example .env   (و مقادیر واقعی را بگذارید)
#   گواهی TLS را در deploy/certs/ قرار دهید (fullchain.pem و privkey.pem) — راهنما: DEPLOY.md
#   docker compose -f docker-compose.prod.yml up -d --build
name: majd

x-app: &app
  image: ${APP_IMAGE:-majd:latest}
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-majd}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در .env تنظیم کنید}@db:5432/${POSTGRES_DB:-majd}
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD را در .env تنظیم کنید}@redis:6379/0
    TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
  restart: unless-stopped
  read_only: true            # فایل‌سیستم کانتینر فقط‌خواندنی؛ فقط media و /tmp قابل نوشتن‌اند
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [backend]
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-majd}
      POSTGRES_USER: ${POSTGRES_USER:-majd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در .env تنظیم کنید}
    volumes: [pgdata:/var/lib/postgresql/data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7-alpine
    # صف Celery و cache: پایدار روی دیسک (appendonly) و بدون حذف خودکار کلیدها (noeviction) تا task گم نشود
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [backend]
    logging: *logging

  # مالکیت volume فایل‌های آپلودی برای کاربر app (volume تازه با مالک root ساخته می‌شود و ترتیب ساخت
  # کانتینرها قطعی نیست). فقط با قابلیت CHOWN و فقط روی خود پوشه (سریع، حتی با media بزرگ).
  init-media:
    image: ${APP_IMAGE:-majd:latest}
    user: root
    entrypoint: ["chown", "10001:10001", "/app/media"]
    volumes: [media:/app/media]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    restart: "no"
    network_mode: none
    logging: *logging

  # یک بار در هر استقرار: migrate، ثبت پوسته‌ها و check --deploy. web فقط پس از موفقیت آن بالا می‌آید.
  migrate:
    <<: *app
    build: .
    command: migrate
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      init-media: {condition: service_completed_successfully}

  web:
    <<: *app
    command: web
    volumes: [media:/app/media]
    expose: ["8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    deploy:
      resources:
        limits: {memory: 1g}

  worker:
    <<: *app
    command: worker
    volumes: [media:/app/media]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
    deploy:
      resources:
        limits: {memory: 768m}

  beat:
    <<: *app
    command: beat
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}

  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./deploy/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - acme:/var/www/acme:ro
      - media:/app/media:ro
    tmpfs: [/var/cache/nginx, /var/run]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks: [frontend, backend]
    logging: *logging

  # پشتیبان‌گیری خودکار: دیتابیس (pg_dump) و فایل‌های media، با حذف نسخه‌های قدیمی‌تر از BACKUP_RETENTION_DAYS
  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/scripts/backup.sh", "loop"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-majd}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-majd}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
      - media:/media:ro
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    networks: [backend]
    logging: *logging

networks:
  frontend:
  backend:

volumes:
  pgdata:
  redisdata:
  media:
  acme:
