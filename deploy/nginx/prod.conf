# nginx production: TLS، فشرده‌سازی، cache فایل‌های استاتیک، محدودیت سیل درخواست و سرو امن media
# هدرهای امنیتی (CSP، HSTS، …) را خود Django می‌فرستد.

# DNS داخلی Docker: پس از ری‌استارت یا به‌روزرسانی web (IP جدید) nginx خودکار آدرس تازه را می‌گیرد؛
# بدون این، nginx آدرس قدیمی را نگه می‌دارد و تا ری‌استارت خودش خطای 502 می‌دهد (nginx ≥ 1.27.3)
resolver 127.0.0.11 valid=10s ipv6=off;

upstream django {
    zone django 64k;
    server web:8000 resolve;
    keepalive 32;
}

# فایل‌های استاتیک hash‌دار (app.<hash>.css) را whitenoise با Cache-Control یک‌ساله می‌دهد؛ nginx نگهشان می‌دارد
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=200m inactive=7d use_temp_path=off;

# دفاع لایه اول در برابر سیل درخواست؛ محدودیت‌های دقیق (ورود، فرم‌ها) در خود برنامه است
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
limit_req_status 429;

server_tokens off;
client_max_body_size 10M;
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

# ---- HTTP: فقط تأیید Let's Encrypt و انتقال به HTTPS ----
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS ----
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;

    location /static/ {
        proxy_pass http://django;
        proxy_cache static;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status always;
    }

    # فایل‌های آپلودشده: هرگز به‌عنوان صفحه یا اسکریپت اجرا نشوند (دفاع لایه‌دوم در برابر فایل مخرب)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        location ~* \.(html?|svgz?|xml|js|mjs|php|py|sh)$ { return 403; }
    }

    location / {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://django;
    }
}
