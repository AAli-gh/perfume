server {
    listen 80;
    client_max_body_size 10M;
    server_tokens off;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # فایل‌های آپلودشده: هرگز به‌عنوان صفحه یا اسکریپت اجرا نشوند (دفاع لایه‌دوم در برابر فایل مخرب)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        location ~* \.(html?|svgz?|xml|js|mjs|php|py|sh)$ { return 403; }
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
