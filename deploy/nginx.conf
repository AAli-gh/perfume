resolver 127.0.0.11 valid=10s ipv6=off;

upstream django {
    zone django 64k;
    server web:8000 resolve;  # آدرس web پس از ری‌استارت خودکار به‌روز می‌شود
}

server {
    listen 80;
    client_max_body_size 10M;
    server_tokens off;

    # استاتیک را whitenoise (داخل image) با نام hash‌دار و gzip/brotli می‌دهد؛ volume جدا لازم نیست و
    # پس از به‌روزرسانی image فایل قدیمی نمی‌ماند
    location /static/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
    }
    # فایل‌های آپلودشده: هرگز به‌عنوان صفحه یا اسکریپت اجرا نشوند (دفاع لایه‌دوم در برابر فایل مخرب)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        location ~* \.(html?|svgz?|xml|js|mjs|php|py|sh)$ { return 403; }
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
