<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود / ثبت‌نام | عطر مجد</title>
  <meta name="description" content="ورود و ساخت حساب کاربری در عطر مجد.">
  <meta name="theme-color" content="#110b08">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23110b08'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23e7b98c' font-family='serif'%3E%D9%85%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="login">
<main class="auth-wrap">
  <div class="auth-grid" id="auth-forms">
    <form class="auth-card" id="login-form" novalidate>
      <h1>ورود</h1>
      <div class="field"><label for="l-email">ایمیل</label><input id="l-email" name="email" type="email" placeholder="آدرس ایمیل" required dir="ltr"></div>
      <div class="field"><label for="l-pass">رمز عبور</label><input id="l-pass" name="password" type="password" placeholder="رمز عبور" required dir="ltr"></div>
      <div class="auth-extra"><label class="check"><input type="checkbox" name="remember"> مرا به خاطر بسپار</label><a href="#" id="forgot">رمز عبور را فراموش کرده‌اید؟</a></div>
      <button class="btn btn-lg btn-block" type="submit">ورود</button>
      <div class="form-msg"></div>
    </form>
    <form class="auth-card" id="register-form" novalidate>
      <h1>ساخت حساب کاربری</h1>
      <div class="field"><label for="s-first">نام</label><input id="s-first" name="first" placeholder="نام" required></div>
      <div class="field"><label for="s-last">نام خانوادگی</label><input id="s-last" name="last" placeholder="نام خانوادگی" required></div>
      <div class="field"><label for="s-email">ایمیل</label><input id="s-email" name="email" type="email" placeholder="آدرس ایمیل" required dir="ltr"></div>
      <div class="field"><label for="s-pass">رمز عبور</label><input id="s-pass" name="password" type="password" placeholder="حداقل ۸ کاراکتر" required minlength="8" dir="ltr"></div>
      <button class="btn btn-lg btn-block" type="submit">ثبت‌نام</button>
      <div class="form-msg"></div>
    </form>
  </div>
  <div class="panel welcome-box" id="welcome" hidden>
    <h1>خوش آمدید، <span id="welcome-name"></span></h1>
    <p>شما وارد حساب کاربری خود شده‌اید.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="btn" href="shop.html">رفتن به فروشگاه</a><a class="btn btn-ghost" href="cart.html">سبد خرید</a><button class="btn btn-ghost" id="logout">خروج</button></div>
  </div>
</main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
