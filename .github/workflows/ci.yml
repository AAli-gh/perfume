# CI عطر مجد: lint ← تست‌ها (+ پوشش) ← تست سرتاسری مرورگر ← بررسی امنیتی وابستگی‌ها
name: CI

on:
  push:
    branches: [main, "ccr-**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://majd:majd@localhost:5432/majd
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15,<0.16"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: majd
          POSTGRES_PASSWORD: majd
          POSTGRES_DB: majd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U majd" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Unit & integration tests (coverage ≥ 95%)
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: majd
          POSTGRES_PASSWORD: majd
          POSTGRES_DB: majd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U majd" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm run build:css
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: End-to-end browser tests (CSP enforced)
        run: pytest -m e2e

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Python dependencies
        run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Production npm dependencies (build tooling is not shipped)
        run: npm audit --omit=dev --audit-level=high
